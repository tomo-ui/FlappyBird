  <link rel="stylesheet" href="style.css">
  <!-- iPhone home-screen app: the system view can be shorter than the screen, so set the screen height before first paint. -->
  <script>
    (function () {
      if (navigator.standalone !== true) return;
      var tall = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
      var h = Math.max(innerWidth > innerHeight ? short : tall, innerHeight);
      var root = document.documentElement;
      root.style.setProperty('--app-height', h + 'px');
      root.classList.add('fit-screen');
    })();
  </script>
